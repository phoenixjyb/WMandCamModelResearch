name: Build legacy reading previews (manual only)

# Historical sources are frozen. Never commit regenerated files over them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install -r requirements-artifacts.txt
      - name: Render legacy previews only in temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research-preview"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/research-preview"
          python "$RUNNER_TEMP/research-preview/scripts/build_artifacts.py"
          echo 'Legacy reading previews only. No byte-archive preservation or visual QA certification is implied.'
      - name: Upload unreviewed legacy previews
        uses: actions/upload-artifact@v4
        with:
          name: legacy-reading-previews-unreviewed
          path: |
            ${{ runner.temp }}/research-preview/docs/**/*.pdf
            ${{ runner.temp }}/research-preview/docs/**/*.docx
            ${{ runner.temp }}/research-preview/docs/**/*.pptx
          if-no-files-found: error
          retention-days: 14
