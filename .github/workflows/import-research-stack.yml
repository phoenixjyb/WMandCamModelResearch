name: Legacy research importer retired

# The former importer downloaded an external mutable archive and could rewrite
# repository history. Retained as a manual notice, with no network import or push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain verified archival recovery
        run: |
          echo 'Legacy remote-payload import is retired.'
          echo 'See docs/spatial-world-model-white-paper/v3.0/RECONCILIATION.md.'
          echo 'Verify original source hashes with scripts/restore_original_v2_sources.py.'
          echo 'Any recovered files require a separate reviewed archival commit.'
