name: Check research source structure (manual)

# File presence is not proof of complete or unchanged archival import.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check current source structure without writing a verification claim
        run: python scripts/validate_research_v3.py --base e88e67e3880b94823f1496093706d25952678465
